<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система тестування</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <script src="scripts/script.js" defer></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl">
        
        <div id="login-screen">
            <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Вхід на тестування</h1>
            <input type="text" id="student-name" placeholder="Прізвище та Ім'я учня" class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="student-class" placeholder="Клас" class="w-full p-3 mb-6 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="startTest()" id="start-btn" class="w-full bg-blue-600 text-white p-3 rounded font-semibold hover:bg-blue-700 transition" disabled>Завантаження тестів...</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <span id="question-tracker" class="text-sm font-semibold text-gray-500"></span>
            </div>
            <h2 id="question-text" class="text-xl font-bold mb-6"></h2>
            <div id="options-container" class="space-y-3"></div>
            <button onclick="nextQuestion()" id="next-btn" class="w-full bg-green-600 text-white p-3 rounded font-semibold mt-6 hidden hover:bg-green-700 transition">Наступне питання</button>
        </div>

        <div id="result-screen" class="hidden text-center">
            <h1 class="text-3xl font-bold mb-4 text-green-600">Тест завершено!</h1>
            <p id="student-result-info" class="text-lg mb-2"></p>
            <p class="text-xl font-semibold mb-6">Твій результат: <span id="score" class="text-blue-600 text-2xl font-bold"></span></p>
            <button onclick="location.reload()" class="bg-gray-200 text-gray-800 p-3 rounded font-semibold hover:bg-gray-300 transition">Повернутись на головну</button>
        </div>

    </div>

</body>
</html>
